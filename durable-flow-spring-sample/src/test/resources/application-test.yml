spring:
  datasource:
    # H2 in-memory database running in PostgreSQL compatibility mode so that
    # the durable-flow PostgreSQL SQL dialect (ON CONFLICT, TIMESTAMPTZ, BYTEA,
    # FOR UPDATE SKIP LOCKED, partial indexes) works correctly.
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # Re-create the application schema (order_records) on every test run.
      ddl-auto: create-drop
    # Disable HibernateDialect auto-detection warning – H2 is fine here.
    show-sql: false

  jms:
    template:
      # Use a 1-second receive timeout so that JmsTemplate.receiveAndConvert()
      # does not block indefinitely while Awaitility is polling for notifications.
      receive-timeout: 1000

  # Artemis broker-url is overridden at runtime by @DynamicPropertySource
  # in OrderWorkflowIntegrationTest; provide safe defaults so the context
  # can load the auto-configuration beans before the override takes effect.
  artemis:
    mode: native
    broker-url: tcp://localhost:61616
    user: artemis
    password: artemis
